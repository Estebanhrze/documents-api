[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "documents-api"
version = "0.1.0"
description = "documents"
requires-python = ">=3.10"

dependencies = [
  "fastapi[standard]",
  "pydantic==2.13.4",
  "python-dotenv==1.2.2",
  "python-multipart>=0.0.20,<1.0",
  "supabase==2.31.0",
]

[tool.setuptools.packages.find]
include = ["app*"]
namespaces = true

[tool.fastapi]
entrypoint = "app.main:app"